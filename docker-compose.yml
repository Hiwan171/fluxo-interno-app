name: fluxo-interno

x-app-environment: &app-environment
  NODE_ENV: production
  TZ: ${TZ:-America/Sao_Paulo}
  # Montada a partir das partes: dentro da rede do compose o host do banco e
  # `db`. A DATABASE_URL do .env aponta para localhost porque serve ao
  # `npm run dev` na maquina — reaproveita-la aqui faria o container procurar
  # o Postgres dentro de si mesmo.
  DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
  APP_URL: ${APP_URL:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  EMAIL_MODE: ${EMAIL_MODE:-log}
  MAIL_FROM: ${MAIL_FROM:-Fluxo Interno <noreply@localhost>}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  UPLOADS_DIR: /app/uploads

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -q -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  app:
    image: ${APP_IMAGE:-fluxo-interno:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    environment: *app-environment
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - next_cache:/app/.next/cache
      - uploads_data:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  worker:
    image: ${APP_IMAGE:-fluxo-interno:local}-tooling
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
    restart: unless-stopped
    init: true
    # `--conditions=react-server` faz o pacote `server-only` resolver para um
    # modulo vazio; sem isso ele lanca ao ser importado fora do Next.
    command:
      ["node_modules/.bin/tsx", "--conditions=react-server", "scripts/email-worker.ts"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    profiles:
      - prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Defina APP_DOMAIN no arquivo .env}
      INTERNAL_NETS: ${INTERNAL_NETS:-192.168.0.0/16 10.0.0.0/8}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Guarda os certificados do Let's Encrypt entre reinicios. Sem este
      # volume o Caddy pede certificado novo a cada subida e bate no limite de
      # emissao da autoridade.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    cap_drop:
      - ALL
    # Necessario para escutar em 80 e 443 sem rodar como root.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  tooling:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
    environment:
      <<: *app-environment
      NODE_ENV: development
    # Sem este volume, `sweep:attachments` olharia uma pasta vazia em vez dos
    # anexos reais e nao limparia nada. Os arquivos pertencem ao usuario 1001 e
    # o `cap_drop: ALL` tira do root o poder de apagar arquivo alheio: rode a
    # coleta com `--user 1001:1001` (ver DEPLOY.md).
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.30
    profiles:
      - dev
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  next_cache:
  mailpit_data:
  uploads_data:

networks:
  backend:
    driver: bridge
